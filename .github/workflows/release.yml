name: Release

on:
  workflow_dispatch:
    inputs:
      package_label:
        description: Optional package label; defaults to the first 8 characters of the commit ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        env:
          MANUAL_LABEL: ${{ inputs.package_label }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          read_version() {
            sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' \
              | head -n 1
          }

          current="$(read_version < welite/identity.lua)"
          if [[ ! "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: welite/identity.lua version must use X.Y.Z format (got: ${current:-missing})" >&2
            exit 1
          fi

          package_label="${MANUAL_LABEL:-${TARGET_SHA:0:8}}"
          if [[ ! "$package_label" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$ ]]; then
            echo "error: package_label must be 1-40 letters, numbers, dots, underscores, or hyphens" >&2
            exit 1
          fi

          echo "current=$current"
          echo "version=$current" >> "$GITHUB_OUTPUT"
          echo "artifact_name=welite.koplugin-$package_label" >> "$GITHUB_OUTPUT"
          echo "archive=dist/welite.koplugin-$package_label.zip" >> "$GITHUB_OUTPUT"

      - name: Build plugin package
        run: bash scripts/package_release.sh "${{ steps.version.outputs.archive }}"

      - name: Generate checksum
        run: |
          archive="${{ steps.version.outputs.archive }}"
          (
            cd "$(dirname "$archive")"
            sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256"
          )
          cat "${{ steps.version.outputs.archive }}.sha256"

      - name: Verify package contents
        run: |
          unzip -l "${{ steps.version.outputs.archive }}"
          test "$(unzip -Z1 "${{ steps.version.outputs.archive }}" | head -n 1)" \
            = "welite.koplugin/"
          unzip -Z1 "${{ steps.version.outputs.archive }}" \
            | grep -qx "welite.koplugin/main.lua"
          unzip -Z1 "${{ steps.version.outputs.archive }}" \
            | grep -qx "welite.koplugin/_meta.lua"
          unzip -Z1 "${{ steps.version.outputs.archive }}" \
            | grep -qx "welite.koplugin/icons/weread-w-book.svg"
          unzip -Z1 "${{ steps.version.outputs.archive }}" \
            | grep -qx "welite.koplugin/welite/integrations/init.lua"
          unzip -Z1 "${{ steps.version.outputs.archive }}" \
            | grep -qx "welite.koplugin/welite/integrations/zenui.lua"
          if unzip -Z1 "${{ steps.version.outputs.archive }}" \
            | grep -Eq '^welite\.koplugin/(spec|scripts|docs|\.github)/'; then
            echo "error: development-only files were included in the release package" >&2
            exit 1
          fi

      - name: Build release notes preface
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/extract_release_notes.sh \
            "$VERSION" \
            dist/release-preface.md
          cat dist/release-preface.md

      - name: Upload plugin package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: ${{ steps.version.outputs.archive }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.version.outputs.artifact_name }}-checksum
          path: ${{ steps.version.outputs.archive }}.sha256
          if-no-files-found: error
          retention-days: 14
